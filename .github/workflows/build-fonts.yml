name: Build Aporetic Fonts

on:
  # Allow manual triggering
  workflow_dispatch:
  
  # Run weekly to catch new Iosevka updates
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
    
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Clone latest Iosevka
        run: |
          git clone --depth 1 https://github.com/be5invis/Iosevka.git iosevka
          cd iosevka
          echo "IOSEVKA_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "IOSEVKA_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo 'main')" >> $GITHUB_ENV
      
      - name: Get build configuration from Protesilaos Aporetic repo
        run: |
          curl -o iosevka/private-build-plans.toml https://raw.githubusercontent.com/protesilaos/aporetic/main/private-build-plans.toml
      
      - name: Install dependencies
        working-directory: iosevka
        run: |
          npm install && sudo apt install ttfautohint
      
      - name: Build all Aporetic variants
        working-directory: iosevka
        run: |
          for variant in aporetic{-sans,-serif}{,-mono} ; do 
            echo "Building $variant..."
            npm run build -- ttf::$variant
          done
      
      - name: Prepare site
        run: |
          mkdir -p site/fonts

          # Copy all TTF files flat into site/fonts/
          for variant in aporetic-sans aporetic-sans-mono aporetic-serif aporetic-serif-mono ; do
            if [ -d "iosevka/dist/$variant/TTF" ]; then
              cp iosevka/dist/$variant/TTF/*.ttf site/fonts/
            fi
          done

      - name: Generate index page
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # 1. Start building the static HTML file
          cat > site/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Aporetic Fonts</title>
            <style>
              body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
              h1 { border-bottom: 2px solid #333; padding-bottom: 0.5rem; }
              .meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
              table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
              th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
              th { background: #f5f5f5; }
              a { color: #0066cc; text-decoration: none; }
              a:hover { text-decoration: underline; }
              code { background: #eee; padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.9em; }
            </style>
          </head>
          <body>
            <h1>Aporetic Fonts</h1>
            <p class="meta">
              Built from Iosevka <code>${{ env.IOSEVKA_VERSION }}</code> (commit <code>${{ env.IOSEVKA_COMMIT }}</code>)<br>
              Last updated: ${BUILD_DATE}
            </p>
            <p>Raw TTF files hosted at <code>/fonts/</code>:</p>
            <table>
              <thead><tr><th>Font File (Direct Link)</th></tr></thead>
              <tbody>
          EOF

          # 2. Inject a row for every actual .ttf file found in the site/fonts folder
          for font_path in site/fonts/*.ttf; do
            font_name=$(basename "$font_path")
            echo "                <tr><td><a href=\"fonts/$font_name\">$font_name</a></td></tr>" >> site/index.html
          done

          # 3. Close the HTML tags
          cat >> site/index.html << EOF
              </tbody>
            </table>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
